[project]
name = "batch-api-distribution-tracker"
version = "0.1.0"
description = "Reproducible OpenAI Batch API turnaround-time experiment (one request per batch) across output-token limits."
requires-python = ">=3.11"
dependencies = [
    "openai==3.11.0",
    "httpx==0.28.1",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
    "plotly==7.0.0",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["experiment"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
